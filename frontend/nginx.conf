# Deliberately exclude request URI, query, Referer, client IP and user agent.
# SSO callback queries contain authorization codes; login_hint contains email.
log_format ucm_minimal '$time_iso8601 method=$request_method status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    access_log /var/log/nginx/access.log ucm_minimal;
    # Nginx error diagnostics can embed the original request line.
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    # Browser hardening. The session token lives in localStorage, so the CSP
    # allows scripts only from this origin: an injected script could read it.
    # 'unsafe-inline' is for styles only (React style attributes); Google
    # Fonts serves Public Sans; blob:/data: cover image previews and the
    # Word download. No location block below sets add_header, so these apply
    # everywhere.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # API requests → backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trusted-User-Role "${TRUSTED_ROLE_HEADER_ROLE}";
        proxy_set_header X-Trusted-Auth-Secret "${TRUSTED_ROLE_HEADER_SECRET}";

        # AI editing via MindRouter can take several minutes
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
