# Deliberately exclude request URI, query, Referer, client IP and user agent.
# SSO callback queries contain authorization codes; login_hint contains email.
log_format ucm_minimal '$time_iso8601 method=$request_method status=$status bytes=$body_bytes_sent duration=$request_time';

server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    access_log /var/log/nginx/access.log ucm_minimal;
    # Nginx error diagnostics can embed the original request line.
    error_log /var/log/nginx/error.log crit;

    root /usr/share/nginx/html;
    index index.html;

    # API requests → backend
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Trusted-User-Role "${TRUSTED_ROLE_HEADER_ROLE}";
        proxy_set_header X-Trusted-Auth-Secret "${TRUSTED_ROLE_HEADER_SECRET}";

        # AI editing via MindRouter can take several minutes
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        try_files $uri $uri/ /index.html;
    }
}
