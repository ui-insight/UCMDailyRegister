services:
  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      LLM_PROVIDER: ${LLM_PROVIDER:-claude}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o}
      MINDROUTER_API_KEY: ${MINDROUTER_API_KEY:-}
      MINDROUTER_ENDPOINT_URL: ${MINDROUTER_ENDPOINT_URL:-https://mindrouter.uidaho.edu/v1/chat/completions}
      MINDROUTER_MODEL: ${MINDROUTER_MODEL:-Qwen/Qwen3-32B}
      OPS_CLASSIFIER_MODEL: ${OPS_CLASSIFIER_MODEL:-qwen/qwen3.8-27b}
      OPS_CLASSIFIER_ENDPOINT_URL: ${OPS_CLASSIFIER_ENDPOINT_URL:-}
      OPS_CLASSIFIER_API_KEY: ${OPS_CLASSIFIER_API_KEY:-}
      ENVIRONMENT: ${ENVIRONMENT:-production}
      UPLOAD_DIR: /app/uploads
      CORS_ORIGINS: '${CORS_ORIGINS:?Set CORS_ORIGINS in .env}'
      TRUSTED_ROLE_HEADER_SECRET: ${TRUSTED_ROLE_HEADER_SECRET:-}
      AUTH_PROVIDER: ${AUTH_PROVIDER:-header}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production-min-32-bytes}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      ENTRA_CLIENT_ID: ${ENTRA_CLIENT_ID:-}
      ENTRA_CLIENT_SECRET: ${ENTRA_CLIENT_SECRET:-}
      ENTRA_METADATA_URL: ${ENTRA_METADATA_URL:-}
      ENTRA_REDIRECT_URI: ${ENTRA_REDIRECT_URI:-}
      OIDC_POST_LOGIN_REDIRECT: ${OIDC_POST_LOGIN_REDIRECT:-}
      OIDC_POST_LOGOUT_REDIRECT: ${OIDC_POST_LOGOUT_REDIRECT:-}
      OIDC_SCOPES: ${OIDC_SCOPES:-openid email profile}
      OIDC_GROUP_SOURCE: ${OIDC_GROUP_SOURCE:-claim}
      OIDC_ROLE_CLAIM: ${OIDC_ROLE_CLAIM:-roles}
      ENTRA_GROUP_STAFF: ${ENTRA_GROUP_STAFF:-}
      ENTRA_GROUP_SLC: ${ENTRA_GROUP_SLC:-}
      ENTRA_GROUP_OPS: ${ENTRA_GROUP_OPS:-}
      SESSION_COOKIE_SECRET: ${SESSION_COOKIE_SECRET:-}
      SEED_OVERWRITE: ${SEED_OVERWRITE:-}
      FEEDBACK_NOTIFICATION_CHANNEL: ${FEEDBACK_NOTIFICATION_CHANNEL:-disabled}
    volumes:
      - uploads:/app/uploads
    networks:
      - ucmnews-net
      - insight-db-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request,sys; sys.exit(0 if urllib.request.urlopen(\"http://localhost:8001/api/v1/readyz\", timeout=3).status == 200 else 1)'"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_APP_ENV: ${VITE_APP_ENV:-production}
    environment:
      TRUSTED_ROLE_HEADER_ROLE: ${TRUSTED_ROLE_HEADER_ROLE:-}
      TRUSTED_ROLE_HEADER_SECRET: ${TRUSTED_ROLE_HEADER_SECRET:-}
    ports:
      - "${HOST_PORT:-9280}:80"
    depends_on:
      - backend
    networks:
      - ucmnews-net
    restart: unless-stopped

volumes:
  uploads:

networks:
  ucmnews-net:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-10.20.9.0/24}
  insight-db-net:
    external: true
