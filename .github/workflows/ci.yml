name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  governance-and-docs:
    name: Governance and documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject tracked environment files
        run: python3 scripts/check_env_files.py
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install documentation validators
        run: pip install -r requirements-docs.txt
      - name: Governance contracts and generated documentation
        run: python scripts/check_governance.py
      - name: Strict documentation build
        run: mkdocs build --strict

  code-health:
    name: Code health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ui-insight/code-health-kit/actions/manifest@v1
      - uses: ui-insight/code-health-kit/actions/secret-scan@v1

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: uv.lock matches pyproject.toml
        run: |
          pip install uv==0.9.5
          uv lock --check
      - name: Install backend dependencies
        run: |
          uv export --frozen --extra dev --extra postgres --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
      - name: Ruff
        run: ruff check .
      - name: Pytest
        run: pytest --cov=app --cov-report=xml
      - uses: ui-insight/code-health-kit/actions/coverage@v1
        with:
          component: backend
          report: backend/coverage.xml
          min: 78

  backend-postgres:
    name: Backend Postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: ucmnews_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ucmnews_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ucmnews_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/uv.lock
      - name: Install backend dependencies
        run: |
          pip install uv==0.9.5
          uv export --frozen --extra dev --extra postgres --no-emit-project -o "$RUNNER_TEMP/requirements.txt"
          pip install --require-hashes -r "$RUNNER_TEMP/requirements.txt"
          pip install --no-deps -e .
      - name: Run Alembic migrations
        run: alembic upgrade head
      - name: Check for migration drift
        run: |
          if ! alembic check; then
            echo "::error::Model metadata drift detected. Run 'alembic revision --autogenerate -m \"description\"' locally, review the generated SQL, and commit the new migration alongside your model change."
            exit 1
          fi
      - name: PostgreSQL smoke test
        run: python tests/postgres_smoke.py
      - name: Create test database
        env:
          PGPASSWORD: postgres
        run: psql -h 127.0.0.1 -U postgres -c "CREATE DATABASE ucmnews_test"
      - name: Pytest on PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:5432/ucmnews_test
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: ESLint
        run: npm run lint -- --max-warnings=0
      - name: Vitest
        run: npm run test:coverage
      - uses: ui-insight/code-health-kit/actions/coverage@v1
        with:
          component: frontend
          report: frontend/coverage/coverage-summary.json
          min: 74
      - name: Build
        run: npm run build
